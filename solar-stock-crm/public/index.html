<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Summary & CRM</title>
<style>
:root{color-scheme:dark;--bg:#07070b;--card:#14131b;--tx:#f3f0f8;--mu:#a29cb3;--bd:#2b2836;--pr:#8a1a8a;--ok:#1b8a52;--bad:#d6403a}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
h1{font-size:18px;margin:0}main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:22px;margin-top:4px}.stat span{color:var(--mu);font-size:13px;display:block}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border:0;border-radius:7px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--bad)}button.k{background:var(--ok)}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.err{color:var(--bad);margin-top:8px;min-height:18px}
#login{max-width:340px;margin:12vh auto}.hide{display:none}
header{background:#000;border-bottom:3px solid #ff8a00}h3{color:#e58cf0}#sum,#csum{background:transparent;border:0;padding:0}.stat{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;--c:#c24bd6}.stat b{color:var(--c)}.stat:nth-child(3n+2){--c:#ff8a00}.stat:nth-child(3n){--c:#6f9bd1}#sum .stat:nth-child(2){--c:#ff5a5a}#sum .stat:nth-child(3n+3){--c:#ff8a00}#sum .stat:nth-child(3n+4){--c:#6f9bd1}#sum .stat:nth-child(3n+5){--c:#c24bd6}tbody tr:hover{background:#1c1a26}.brand{display:flex;align-items:center;gap:12px}select.sm{padding:5px;width:auto}#prevbox *{box-sizing:content-box}#prevbox .docx-wrapper{background:transparent;padding:0}#prevbox section.docx{background:#fff;color:#000;margin:0 auto 16px;box-shadow:0 2px 12px #0008}
@page{size:A4;margin:0}
@media print{body.pa>*:not(#prevov){display:none!important}body.pa{background:#fff!important}#prevov{position:static!important;overflow:visible!important;background:#fff!important}#prevov .tb{display:none!important}#prevbox{padding:0!important;zoom:1!important}#prevbox .docx-wrapper{background:none!important;padding:0!important}#prevbox section.docx{box-shadow:none!important;margin:0!important;break-after:page}}
</style>
<link rel="icon" href="/logo.png">
<script src="/jszip.min.js"></script>
<script src="/docx-preview.min.js"></script>
<script src="/jspdf.umd.min.js"></script>
</head>
<body>
<script>const SHOP = 'SKY ELECTROFAB SOLAR', SHOP_ADDR = 'Ghat Road, Chalisgaon, Dist. Jalgaon - 424101', SHOP_PHONE = '8668651086', LOGO = new URL('/logo.png', location.href).href;</script>

<div id="login" class="card">
  <div style="text-align:center"><img src="/logo.png" width="250" alt="Sky Electrofab Solar"></div><h3 style="text-align:center;margin:6px 0 14px">Stock & CRM Login</h3>
  <label>Login as</label>
  <select id="lu"><option value="stockist">Stockist</option><option value="admin">Admin</option></select><br><br>
  <label>Password</label><input id="lp" type="password" autocomplete="current-password"><label style="display:flex;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;cursor:pointer"><input type="checkbox" style="width:auto" onchange="$('#lp').type=this.checked?'text':'password'"> Show password</label>
  <button onclick="doLogin()" style="width:100%">Login</button>
  <div class="err" id="le"></div>
</div>

<div id="app" class="hide">
  <header><div class="brand"><img class="logo" src="/logo.png" height="64" alt=""><h1 id="ttl"></h1></div><button class="g" onclick="logout()">Logout</button></header>
  <main>
    <div class="tabs" id="tabs"></div>

    <section id="p-stock">
      <div class="card">
        <h3 style="margin-top:0">Add / Remove Stock</h3>
        <div class="grid">
          <div><label>Stock type</label><select id="st" onchange="typeSel()"></select></div>
          <div><label>Item name</label><input id="sn" list="names" oninput="fill()"><datalist id="names"></datalist></div>
          <div><label>Unit</label><input id="su" list="units" value="Nos"><datalist id="units"><option>Nos</option><option>Box</option><option>Pack</option><option>Set</option><option>Bundle</option><option>kg</option><option>Mtr</option></datalist></div>
          <div><label>Watt (optional)</label><input id="sw" type="number" min="0"></div>
          <div><label>Quantity</label><input id="sq" type="number" min="1" value="1"></div>
        </div>
        <div class="row"><button class="k" onclick="chg(1)">+ Add stock</button><button class="r" onclick="chg(-1)">- Remove stock</button></div>
        <div class="err" id="se"></div>
      </div>
      <div class="card tw">
        <div class="grid" style="margin-bottom:10px"><input id="q" placeholder="Search item..." oninput="drawStock()"><select id="ft" onchange="drawStock()"></select><button class="g" onclick="exportCsv()">Export to Excel (CSV)</button></div>
        <table><thead><tr><th>Type</th><th>Item</th><th>Unit</th><th>Watt</th><th>Qty</th></tr></thead><tbody id="sb"></tbody></table>
      </div>
      <div class="card hide" id="delcard"><h3 style="margin-top:0">Delete item (Admin only)</h3><div class="row" style="margin-top:0"><select id="di" style="flex:3;min-width:220px"></select><button class="r" onclick="delSel()">Delete selected item</button></div><div class="err" id="de"></div></div>
    </section>

    <section id="p-orders" class="hide">
      <div class="card hide" id="ocreate">
        <h3 style="margin-top:0">New delivery order - send to stockist</h3>
        <div class="grid"><div><label>Customer name</label><input id="dn" list="custnames" oninput="dfill()"><datalist id="custnames"></datalist></div><div><label>Site / delivery address</label><input id="ds"></div><div><label>Note for stockist (optional)</label><input id="dnote" placeholder="e.g. deliver by Monday 10 AM"></div></div><br>
        <div id="dl"></div>
        <div class="row"><button class="g" onclick="olines.push({id:'',qty:1});drawOLines()">+ Add item</button><button class="k" onclick="sendOrder()">Send to stockist</button></div>
        <div class="err" id="doe"></div>
      </div>
      <div id="olist"></div>
    </section>

    <section id="p-out" class="hide">
      <div class="card">
        <h3 style="margin-top:0">Stock Out - when bill is generated</h3><div id="oinfo" style="color:var(--mu);margin-bottom:10px"></div>
        <div class="grid"><div><label>Bill number</label><input id="ob"></div><div><label>Customer name</label><input id="oc"></div><div><label>Customer type</label><select id="oct"><option value="">Select type</option><option>B2B</option><option>B2C</option></select></div><div><label>Payment type</label><select id="opt"><option value="">Select payment</option><option>Cash</option><option>Online</option><option>Site</option></select></div></div><br>
        <div id="ol"></div>
        <div class="row"><button class="g" onclick="lines.push({id:'',qty:1});drawLines()">+ Add item</button><button class="k" onclick="doOut()">Generate Stock Out</button></div>
        <div class="err" id="oe"></div>
      </div>
      <div class="card tw"><h3 style="margin-top:0">Stock out history</h3>
        <table><thead><tr><th>Date</th><th>Bill</th><th>Customer</th><th>Type</th><th>Payment</th><th>Items</th><th>By</th><th></th></tr></thead><tbody id="ob2"></tbody></table></div>
    </section>

    <section id="p-crm" class="hide">
      <div class="grid card" id="csum"></div>
      <div class="card">
        <h3 style="margin-top:0">New Customer</h3>
        <div class="grid">
          <div><label>Customer name</label><input id="cn"></div>
          <div><label>Phone (optional)</label><input id="cph"></div><div><label>Electricity consumer number</label><input id="ccn"></div><div><label>Address</label><input id="cad"></div><div><label>District</label><input id="cdi"></div>
          <div><label>Panel watt</label><input id="cpw" type="number" min="0"></div>
          <div><label>Inverter watt</label><input id="ciw" type="number" min="0"></div>
          <div><label>Total project cost (optional)</label><input id="ctc" type="number" min="0"></div>
          <div><label>Cash or Loan</label><select id="cpt" onchange="ptChange()"><option value="cash">Cash</option><option value="loan">Loan</option></select></div>
          <div id="lw" class="hide"><label>Loan amount</label><input id="cla" type="number" min="0"></div>
          <div><label id="cal">Cash amount</label><input id="cca" type="number" min="0" oninput="warn()"></div>
        </div>
        <div class="err" id="cw"></div>
        <div class="row"><button onclick="addC()">Save customer</button></div>
        <div class="err" id="ce"></div>
      </div>
      <div class="card hide" id="pay"></div>
      <div class="card tw"><table><thead><tr><th>#</th><th>Date</th><th>Name</th><th>Panel W</th><th>Inverter W</th><th>Type</th><th>Status</th><th>Total</th><th>Loan</th><th>Cash paid</th><th>Balance</th><th></th></tr></thead><tbody id="cb"></tbody></table></div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let tok = localStorage.getItem('t'), role = localStorage.getItem('r'), stock = [], cust = [];
const inr = n => '₹' + (+n || 0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, d = {}) {
  let r, j;
  try { r = await fetch('/api/app', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: tok || '' }, body: JSON.stringify({ action, ...d }) }); }
  catch (e) { throw new Error('No internet / server not reachable'); }
  try { j = await r.json(); } catch (e) { throw new Error('Server error (HTTP ' + r.status + '). The /api folder is not deployed - see README (Root Directory).'); }
  if (r.status === 401 && action !== 'login') logout();
  if (!r.ok) throw new Error(j.error || 'Server error');
  return j;
}
async function doLogin() {
  const pw = $('#lp').value, first = $('#lu').value; let err = null;
  for (const u of [first, first === 'admin' ? 'stockist' : 'admin']) {   // also try the other login if the password belongs to it
    try {
      const j = await api('login', { user: u, password: pw });
      tok = j.token; role = j.role; localStorage.setItem('t', tok); localStorage.setItem('r', role); $('#le').textContent = ''; start(); return;
    } catch (e) { err = err || e; }
  }
  $('#le').textContent = /^Wrong password/.test(err.message) ? 'Wrong password. Tick "Show password" to check what you typed, then try again.' : err.message;
}

function logout() { localStorage.clear(); tok = role = null; $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lp').value = ''; }
async function start() {
  if (!tok) return;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#ttl').textContent = role === 'admin' ? 'Admin Panel' : 'Stockist Panel'; $('#delcard').classList.toggle('hide', role !== 'admin');
  $('#tabs').innerHTML = ['stock:Stock Summary', 'orders:Delivery Orders', 'out:Stock Out (Bill)'].concat(role === 'admin' ? ['crm:Customers (CRM)'] : []).map(x => `<button id="b-${x.split(':')[0]}" onclick="tab('${x.split(':')[0]}')">${x.split(':')[1]}</button>`).join(''); $('#ocreate').classList.toggle('hide', role !== 'admin'); drawOLines();
  tab('stock');
  try { setS(await api('stock')); if (role === 'admin') { cust = await api('customers'); drawCust(); } } catch (e) {}
}
function tab(t) { ['stock', 'orders', 'out', 'crm'].forEach(x => { $('#p-' + x).classList.toggle('hide', x !== t); $('#b-' + x)?.classList.toggle('on', x === t); }); }

let S = { stock: [], types: [], out: [] }, lines = [{ id: '', qty: 1 }];
/* in-page dialog (browser confirm/prompt are blocked in some frames) */
function dlg(msg, input) {
  return new Promise(res => {
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px';
    o.innerHTML = `<div class="card" style="max-width:400px;width:100%;margin:0"><p style="white-space:pre-wrap;margin-top:0">${esc(msg)}</p>${input ? '<input class="dg">' : ''}<div class="row" style="justify-content:flex-end"><button class="g dn">Cancel</button><button class="dy">${input ? 'OK' : 'Yes, continue'}</button></div></div>`;
    document.body.appendChild(o);
    const t = o.querySelector('.dg'), end = v => { o.remove(); res(v); };
    o.querySelector('.dn').onclick = () => end(input ? null : false);
    o.querySelector('.dy').onclick = () => end(input ? t.value : true);
    if (t) { t.focus(); t.onkeydown = e => e.key === 'Enter' && end(t.value); }
  });
}
function setS(j) { S = j; drawStock(); drawLines(); drawOut(); drawOrders(); drawOLines(); }
function drawStock() {
  const ty = $('#st').value, ft0 = $('#ft').value, o = S.types.map(t => `<option>${esc(t)}</option>`).join('');
  $('#st').innerHTML = o + '<option value="__new">+ Add new type...</option>';
  $('#ft').innerHTML = '<option value="">All types</option>' + o;
  if (S.types.includes(ty)) $('#st').value = ty;
  if (S.types.includes(ft0)) $('#ft').value = ft0;
  $('#names').innerHTML = S.stock.map(s => `<option value="${esc(s.name)}">`).join('');
  const di = $('#di'); if (di) { const cur = di.value; di.innerHTML = '<option value="">Select item to delete</option>' + S.types.map(t => { const l = S.stock.filter(s => s.type === t); return l.length ? `<optgroup label="${esc(t)}">` + l.map(s => `<option value="${s.id}">${esc(s.name)} (${s.qty} ${esc(s.unit)})</option>`).join('') + '</optgroup>' : ''; }).join(''); di.value = cur; if (di.selectedIndex < 0) di.selectedIndex = 0; }
  const q = ($('#q').value || '').toLowerCase(), f = $('#ft').value;
  $('#sb').innerHTML = S.stock.filter(s => (!f || s.type === f) && s.name.toLowerCase().includes(q)).map(s => `<tr><td>${esc(s.type)}</td><td style="white-space:normal">${esc(s.name)}</td><td>${esc(s.unit)}</td><td>${s.watt || ''}</td><td><b style="color:${s.qty <= 5 ? 'var(--bad)' : 'inherit'}">${s.qty}</b></td></tr>`).join('') || '<tr><td colspan="5">No items</td></tr>';
}
function fill() { const it = S.stock.find(s => s.name.toLowerCase() === $('#sn').value.trim().toLowerCase()); if (it) { $('#st').value = it.type; $('#su').value = it.unit; $('#sw').value = it.watt || ''; } }
async function typeSel() {
  if ($('#st').value !== '__new') return;
  const n = ((await dlg('Enter new stock type name', true)) || '').trim();
  try { if (n) { setS(await api('typeAdd', { name: n })); $('#st').value = S.types.find(t => t.toLowerCase() === n.toLowerCase()); } else $('#st').selectedIndex = 0; } catch (e) { $('#se').textContent = e.message; }
}
async function chg(sign) {
  $('#se').textContent = '';
  try { setS(await api('stockChange', { type: $('#st').value, name: $('#sn').value, unit: $('#su').value, watt: $('#sw').value, delta: sign * Math.abs(+$('#sq').value) })); }
  catch (e) { $('#se').textContent = e.message; }
}
async function delSel() {
  const id = $('#di').value, it = S.stock.find(s => s.id === id); $('#de').textContent = '';
  if (!it) { $('#de').textContent = 'Select an item first'; return; }
  if (await dlg('Delete "' + it.name + '" (' + it.qty + ' ' + it.unit + ' in stock) completely?\nThis cannot be undone.')) { try { setS(await api('stockDelete', { id })); } catch (e) { $('#de').textContent = e.message; } }
}

const opts = cur => '<option value="">Select item</option>' + S.types.map(t => { const l = S.stock.filter(s => s.type === t && s.qty > 0); return l.length ? `<optgroup label="${esc(t)}">` + l.map(s => `<option value="${s.id}"${s.id === cur ? ' selected' : ''}>${esc(s.name)} (${s.qty} ${esc(s.unit)})</option>`).join('') + '</optgroup>' : ''; }).join('');
function drawLines() {
  $('#ol').innerHTML = lines.map((l, i) => `<div class="row" style="margin:0 0 8px"><div style="flex:3;min-width:220px"><select onchange="lines[${i}].id=this.value">${opts(l.id)}</select></div><div style="flex:1;min-width:80px"><input type="number" min="1" value="${l.qty}" oninput="lines[${i}].qty=this.value"></div><button class="g" onclick="lines.length>1?lines.splice(${i},1):0;drawLines()">✕</button></div>`).join('');
}
async function doOut() {
  const e = $('#oe'); e.textContent = '';
  try {
    setS(await api('stockOut', { bill: $('#ob').value, customer: $('#oc').value, items: lines, orderId: curOrder, custType: $('#oct').value, payType: $('#opt').value }));
    lines = [{ id: '', qty: 1 }]; $('#ob').value = $('#oc').value = $('#oct').value = $('#opt').value = ''; drawLines();
    curOrder = null; $('#oinfo').textContent = ''; e.style.color = 'var(--ok)'; e.textContent = 'Stock out done. Stock updated.';
  } catch (x) { e.style.color = 'var(--bad)'; e.textContent = x.message; }
}
function drawOut() {
  $('#ob2').innerHTML = S.out.map((o, i) => `<tr><td>${new Date(o.date).toLocaleDateString('en-IN')}</td><td>${esc(o.bill)}</td><td>${esc(o.customer)}</td><td>${esc(o.custType || '-')}</td><td>${esc(o.payType || '-')}</td><td style="white-space:normal">${o.items.map(i => esc(i.name) + ' x ' + i.qty + ' ' + esc(i.unit)).join(', ')}</td><td>${esc(o.by)}</td><td><button class="g" onclick="slip(${i})">Print slip</button></td></tr>`).join('') || '<tr><td colspan="8">No stock out yet</td></tr>';
}
function exportCsv() {
  const t = [['Type', 'Item', 'Unit', 'Watt', 'Qty'], ...S.stock.map(s => [s.type, s.name, s.unit, s.watt || '', s.qty])].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/csv' }));
  a.download = 'stock-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}

/* ---------- Delivery orders ---------- */
let olines = [{ id: '', qty: 1 }], curOrder = null;
const optsAll = cur => '<option value="">Select item</option>' + S.types.map(t => { const l = S.stock.filter(s => s.type === t); return l.length ? `<optgroup label="${esc(t)}">` + l.map(s => `<option value="${s.id}"${s.id === cur ? ' selected' : ''}>${esc(s.name)} (${s.qty} ${esc(s.unit)} in stock)</option>`).join('') + '</optgroup>' : ''; }).join('');
function drawOLines() {
  if (!$('#dl')) return;
  $('#dl').innerHTML = olines.map((l, i) => `<div class="row" style="margin:0 0 8px"><div style="flex:3;min-width:220px"><select onchange="olines[${i}].id=this.value">${optsAll(l.id)}</select></div><div style="flex:1;min-width:80px"><input type="number" min="1" value="${l.qty}" oninput="olines[${i}].qty=this.value"></div><button class="g" onclick="olines.length>1?olines.splice(${i},1):0;drawOLines()">✕</button></div>`).join('');
}
function dfill() { const c = cust.find(x => x.name.toLowerCase() === $('#dn').value.trim().toLowerCase()); if (c && c.address && !$('#ds').value) $('#ds').value = c.address; }
async function sendOrder() {
  const e = $('#doe'); e.textContent = '';
  try {
    setS(await api('orderAdd', { customer: $('#dn').value, site: $('#ds').value, note: $('#dnote').value, items: olines }));
    olines = [{ id: '', qty: 1 }]; $('#dn').value = $('#ds').value = $('#dnote').value = ''; drawOLines();
    e.style.color = 'var(--ok)'; e.textContent = 'Order sent to stockist.';
  } catch (x) { e.style.color = 'var(--bad)'; e.textContent = x.message; }
}
function drawOrders() {
  const O = S.orders || [], n = O.filter(o => o.status === 'Pending').length, col = { Pending: '#ff8a00', Ready: '#1b8a52', Delivered: '#6f9bd1' };
  if ($('#b-orders')) $('#b-orders').textContent = 'Delivery Orders' + (n ? ` (${n} new)` : '');
  $('#olist').innerHTML = [...O.filter(o => o.status !== 'Delivered'), ...O.filter(o => o.status === 'Delivered')].map(o => `<div class="card" style="border-left:4px solid ${col[o.status]}"><div class="row" style="margin:0;justify-content:space-between"><b>#${o.no} - ${esc(o.customer)}</b><b style="color:${col[o.status]}">${o.status}</b></div><div style="color:var(--mu);margin:6px 0">${o.site ? 'Site: ' + esc(o.site) + '<br>' : ''}${o.note ? 'Note: ' + esc(o.note) + '<br>' : ''}Sent ${new Date(o.date).toLocaleDateString('en-IN')}${o.bill ? ' | Bill ' + esc(o.bill) : ''}</div><div class="tw"><table><thead><tr><th>Item</th><th>Needed</th><th>In stock</th></tr></thead><tbody>${o.items.map(i => { const s = S.stock.find(x => x.id === i.id), av = s ? s.qty : 0; return `<tr><td style="white-space:normal">${esc(i.name)}</td><td><b>${i.qty} ${esc(i.unit)}</b></td><td style="color:${av < i.qty ? 'var(--bad)' : 'var(--ok)'}">${av}${av < i.qty ? ' (short)' : ''}</td></tr>`; }).join('')}</tbody></table></div><div class="row">${o.status === 'Pending' ? `<button class="k" onclick="setOrd('${o.id}','Ready')">Mark material ready</button>` : ''}${o.status === 'Ready' ? `<button class="g" onclick="setOrd('${o.id}','Pending')">Back to pending</button>` : ''}${o.status !== 'Delivered' ? `<button onclick="toStockOut('${o.id}')">Make stock out</button>` : ''}${role === 'admin' ? `<button class="g" onclick="delOrd('${o.id}')">Delete</button>` : ''}</div></div>`).join('') || '<div class="card">No delivery orders yet</div>';
}

function words(n) {

  const t = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const h = x => (x > 99 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? t(x % 100) : '');
  let r = ''; [[1e7, 'Crore'], [1e5, 'Lakh'], [1e3, 'Thousand']].forEach(([v, s]) => { if (n >= v) { r += h(Math.floor(n / v)) + ' ' + s + ' '; n %= v; } });
  return (r + h(n)).trim();
}
